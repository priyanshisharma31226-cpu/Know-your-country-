<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desh Bolte Hain - Vector Maps</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.7s ease;
    }
    h1 { font-size: 1.9rem; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .subtitle { opacity: 0.85; margin-bottom: 20px; font-size: 0.95rem; }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 25px 20px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    .map-container {
      width: 100%;
      height: 260px;
      margin: 0 auto 15px;
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .map-container img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: invert(27%) sepia(51%) saturate(2878%) hue-rotate(196deg) brightness(94%) contrast(97%);
    }
    .flag-small {
      width: 70px;
      height: 45px;
      object-fit: cover;
      border-radius: 6px;
      margin: 0 auto 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: block;
    }
    .country-name { font-size: 1.7rem; font-weight: 700; margin-bottom: 6px; }
    .capital { font-size: 1.1rem; margin-bottom: 12px; opacity: 0.95; }
    .places {
      background: rgba(0,0,0,0.28);
      border-radius: 14px;
      padding: 12px;
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 11px 20px;
      font-size: 0.95rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s;
    }
    .btn-prev { background: #ff6b6b; color: white; }
    .btn-next { background: #4ecdc4; color: #111; }
    .btn-speak { background: #ffe66d; color: #111; }
    button:hover { transform: scale(1.05); filter: brightness(1.1); }
    .counter { margin-top: 15px; font-size: 0.88rem; opacity: 0.7; }
  </style>
</head>
<body>

  <h1>🌍 Desh Bolte Hain</h1>
  <p class="subtitle">Vector Map + Flag + Voice</p>

  <div class="card">
    <div class="map-container">
      <img id="vectorMap" src="" alt="Country Map">
    </div>
    <img id="flag" class="flag-small" src="" alt="Flag">
    <div class="country-name" id="name"></div>
    <div class="capital" id="capital"></div>
    <div class="places" id="places"></div>

    <div class="buttons">
      <button class="btn-prev" onclick="prevCountry()">◀ Previous</button>
      <button class="btn-speak" onclick="speakCurrent()">🔊 Suno</button>
      <button class="btn-next" onclick="nextCountry()">Next ▶</button>
    </div>
    <div class="counter" id="counter"></div>
  </div>
