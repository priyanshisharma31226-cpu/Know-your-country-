    \"background_color\": \"#0f2027\",
    \"theme_color\": \"#0f2027\",
    \"orientation\": \"portrait\",
    \"icons\": [
      {
        \"src\": \"https://flagcdn.com/w160/in.png\",
        \"sizes\": \"192x192\",
        \"type\": \"image/png\"

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: background 0.7s ease;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.8rem; margin-bottom: 6px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .subtitle { opacity: 0.85; margin-bottom: 18px; font-size: 0.95rem; }
    .card {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 22px 18px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }
    .map-container {
      width: 100%;
      height: 240px;
      margin: 0 auto 14px;
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .map-container img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      filter: invert(27%) sepia(51%) saturate(2878%) hue-rotate(196deg) brightness(94%) contrast(97%);
    }
    .flag-small {
      width: 68px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      margin: 0 auto 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: block;
    }
    .country-name { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
    .capital { font-size: 1.05rem; margin-bottom: 12px; opacity: 0.95; }
    .places {
      background: rgba(0,0,0,0.28);
      border-radius: 14px;
      padding: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 18px;
      font-size: 0.95rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.25s;
      touch-action: manipulation;
    }
    .btn-prev { background: #ff6b6b; color: white; }
    .btn-next { background: #4ecdc4; color: #111; }
    .btn-speak { background: #ffe66d; color: #111; }
    button:active { transform: scale(0.96); }
    .counter { margin-top: 14px; font-size: 0.85rem; opacity: 0.7; }
  </style>
</head>
<body>

  <p class="subtitle">Vector Map + Flag + Voice</p>

    <div class="capital" id="capital"></div>
    <div class="places" id="places"></div>

    <div class="buttons">

      <button class="btn-next" onclick="nextCountry()">Next ▶</button>
    </div>
    <div class="counter" id="counter"></div>

      { name: "Israel", code: "il", capital: "Jerusalem", places: "Western Wall, Dead Sea, Tel Aviv", speech: "Hi dosto, main Israel hoon. Mera capital Jerusalem hai. Mere desh mein famous places hain jaise Western Wall aur Dead Sea." }
    ];

    let currentIndex = 0;
    let hindiVoice = null;

    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      hindiVoice = voices.find(v => v.lang.startsWith('hi') && (v.name.toLowerCase().includes('female') || v.name.includes('Google') || v.name.includes('Microsoft'))) 
                || voices.find(v => v.lang.startsWith('hi')) 
                || null;
    }
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function showCountry(index) {
      const c = countries[index];
      
      document.getElementById('vectorMap').src = `https://cdn.jsdelivr.net/gh/djaiss/mapsicon@master/all/${c.code}/vector.svg`;
      document.getElementById('flag').src = `https://flagcdn.com/w160/${c.code}.png`;
      
      document.getElementById('name').textContent = c.name;
      document.getElementById('capital').innerHTML = `<strong>Capital:</strong> ${c.capital}`;
      document.getElementById('places').innerHTML = `<strong>Famous Places:</strong><br>${c.places}`;
      document.getElementById('counter').textContent = `${index + 1} / ${countries.length}`;

      const bgs = [
        'linear-gradient(135deg, #0f2027, #203a43, #2c5364)',
        'linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d)',
        'linear-gradient(135deg, #134e5e, #71b280)',
        'linear-gradient(135deg, #4b1248, #f0c27b)',
        'linear-gradient(135deg, #0f0c29, #302b63, #24243e)'
      ];
      document.body.style.background = bgs[index % bgs.length];

      speak(c.speech);
    }

    function speak(text) {
      speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'hi-IN';
      utter.rate = 0.92;
      utter.pitch = 1.08;
      if (hindiVoice) utter.voice = hindiVoice;
      speechSynthesis.speak(utter);
    }

    function speakCurrent() { speak(countries[currentIndex].speech); }
    function nextCountry() { currentIndex = (currentIndex + 1) % countries.length; showCountry(currentIndex); }
    function prevCountry() { currentIndex = (currentIndex - 1 + countries.length) % countries.length; showCountry(currentIndex); }

    showCountry(0);
  </script>
